name: Сборка Windows-версии

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install pyinstaller

      - name: Тесты
        run: python -m pytest -q

      - name: Сборка exe
        run: python -m PyInstaller fnsportal.spec --noconfirm --log-level WARN

      - name: Проверка запуска
        shell: pwsh
        run: |
          $exe = "dist\fns-portal.exe"
          $proc = Start-Process $exe -ArgumentList "--no-browser","--no-demo","--port","8321" -PassThru
          Start-Sleep -Seconds 45
          try {
            $meta = Invoke-RestMethod "http://127.0.0.1:8321/api/meta" -TimeoutSec 20
            if (-not $meta.taxes) { throw "API вернул пустой список налогов" }
            Write-Host "Портал ответил, налогов в справочнике:" $meta.taxes.Count
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }

      - uses: actions/upload-artifact@v4
        with:
          name: fns-portal-windows
          path: dist/fns-portal.exe
          retention-days: 90

      - name: Релиз по тегу
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/fns-portal.exe
