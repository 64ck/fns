name: Сборка Windows-версии

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

# Публикация релиза требует права записи в содержимое репозитория:
# по умолчанию токен сборки доступен только на чтение.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install pyinstaller

      - name: Тесты
        run: python -m pytest -q

      - name: Сборка exe
        run: python -m PyInstaller fnsportal.spec --noconfirm --log-level WARN

      - name: Проверка запуска
        shell: pwsh
        run: |
          $exe = "dist\fns-portal.exe"
          $proc = Start-Process $exe -ArgumentList "--no-browser","--no-demo","--port","8321" -PassThru
          Start-Sleep -Seconds 45
          try {
            $meta = Invoke-RestMethod "http://127.0.0.1:8321/api/meta" -TimeoutSec 20
            if (-not $meta.taxes) { throw "API вернул пустой список налогов" }
            Write-Host "Портал ответил, налогов в справочнике:" $meta.taxes.Count
          } finally {
            # onefile-сборка запускает дочерний процесс, поэтому гасим по имени
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            Get-Process fns-portal -ErrorAction SilentlyContinue | Stop-Process -Force
          }

      - uses: actions/upload-artifact@v4
        with:
          name: fns-portal-windows
          path: dist/fns-portal.exe
          retention-days: 90

      # Если у репозитория закрыта запись для Actions, публикация релиза
      # не должна ронять сборку: exe остаётся доступен как артефакт.
      - name: Свежая сборка в релиз «latest»
        if: github.ref_type == 'branch'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Последняя сборка
          prerelease: true
          files: dist/fns-portal.exe
          body: |
            Автоматическая сборка ветки ${{ github.ref_name }}.
            Коммит: ${{ github.sha }}

            Программа проверяет этот релиз при запуске и предлагает обновиться.

      - name: Релиз по тегу
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/fns-portal.exe
